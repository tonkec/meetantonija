<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="%PUBLIC_URL%/favicon.svg"
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Reddit+Mono:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#c2410c" />
    <meta name="robots" content="index,follow" />

    <link
      rel="canonical"
      href="https://meetantonija.com/"
    />

    <!--
      Static SEO shell for crawlers and social previews that do not execute JS.
      After `npm run build`, scripts/generate-static-pages.js writes per-route HTML
      (meta + semantic #root content) without a framework migration or headless browser.
    -->

    <title>
      Antonija Šimić — Senior Frontend & Full-Stack Engineer
    </title>

    <meta
      name="description"
      content="Senior Frontend & Full-Stack Engineer specializing in React, React Native, TypeScript and Node.js, building production web and mobile products from UI to backend APIs and cloud deployment."
    />

    <!-- Open Graph -->

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Antonija Šimić — Senior Frontend & Full-Stack Engineer"
    />

    <meta
      property="og:description"
      content="Senior Frontend & Full-Stack Engineer specializing in React, React Native, TypeScript and Node.js, building production web and mobile products from UI to backend APIs and cloud deployment."
    />

    <meta
      property="og:url"
      content="https://meetantonija.com/"
    />

    <meta
      property="og:image"
      content="https://avatars.githubusercontent.com/u/5020758?v=4"
    />

    <meta
      property="og:site_name"
      content="Antonija Šimić"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Twitter -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Antonija Šimić — Senior Frontend & Full-Stack Engineer"
    />

    <meta
      name="twitter:description"
      content="Senior Frontend & Full-Stack Engineer specializing in React, React Native, TypeScript and Node.js, building production web and mobile products from UI to backend APIs and cloud deployment."
    />

    <meta
      name="twitter:image"
      content="https://avatars.githubusercontent.com/u/5020758?v=4"
    />

    <!-- Structured data -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://meetantonija.com/#person",
            "name": "Antonija Šimić",
            "alternateName": "Antonija Šimić",
            "jobTitle": "Senior Frontend & Full-Stack Engineer",
            "url": "https://meetantonija.com/",
            "image": "https://avatars.githubusercontent.com/u/5020758?v=4",
            "email": "mailto:antonija1023@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Zagreb",
              "addressCountry": "Croatia"
            },
            "sameAs": [
              "https://github.com/tonkec",
              "https://www.linkedin.com/in/antonija-simic/",
              "https://codepen.io/tonkec"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://meetantonija.com/#website",
            "url": "https://meetantonija.com/",
            "name": "Antonija Šimić",
            "description": "Senior Frontend & Full-Stack Engineer specializing in React, React Native, TypeScript and Node.js, building production web and mobile products from UI to backend APIs and cloud deployment.",
            "author": {
              "@id": "https://meetantonija.com/#person"
            }
          }
        ]
      }
    </script>

    <!-- App icons / manifest -->

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />
  </head>

  <body>
    <noscript>
